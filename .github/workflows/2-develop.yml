name: 2 - Develop

on:
  workflow_dispatch:

  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"

  pull_request:
    branches:
      - develop
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_build:
    name: Test + Coverage + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build site (dist)
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-site
          path: dist/

  sonar:
    name: SonarQube Scan
    needs: [test_build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=keephouse
            -Dsonar.projectName=keephouse
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy_develop:
    name: Deploy develop
    needs: [test_build]
    if: ${{ github.event_name != 'pull_request' }} # deploy só em push/manual
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-site
          path: dist

      - name: Deploy to develop (placeholder)
        run: |
          echo "Publicando dist/ em develop..."
          ls -la dist
