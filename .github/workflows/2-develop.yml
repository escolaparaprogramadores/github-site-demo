name: 2 - Develop

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs: 
  shared-job: 
    uses: ./.github/workflows/2-reusable-develop.yml
    secrets: inherit

