name: 3 - Pre-release

on:
  workflow_run:
    workflows: ["2 - Develop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pre-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  create_release_pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop (full)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Stop if develop was updated from main (avoid loop)
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $MSG"
          if echo "$MSG" | grep -qiE "from main|Merge branch 'main'"; then
            echo "Develop updated from main. Skipping."
            exit 0
          fi

      - name: Stop if develop has no commits ahead of main
        run: |
          git fetch origin main develop --quiet
          DIFF_COUNT=$(git rev-list --count origin/main..origin/develop)
          echo "Commits in develop not in main: $DIFF_COUNT"
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "Nada novo para release (develop == main)."
            exit 0
          fi

      - name: Compute next SemVer tag (patch) using REMOTE tags
        id: semver
        run: |
          git fetch --tags origin --force --quiet

          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          fi

          # tenta achar uma versão que ainda NÃO exista como branch release/ e nem como tag
          for i in $(seq 1 50); do
            NEXT_PATCH=$((PATCH + i))
            NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            RELEASE_BRANCH="release/${NEXT_TAG}"

            TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/${NEXT_TAG}" | wc -l | tr -d ' ')
            BR_EXISTS=$(git ls-remote --heads origin "${RELEASE_BRANCH}" | wc -l | tr -d ' ')

            if [ "$TAG_EXISTS" -eq 0 ] && [ "$BR_EXISTS" -eq 0 ]; then
              echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
              echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "Chosen NEXT_TAG=$NEXT_TAG"
              exit 0
            fi
          done

          echo "Não consegui encontrar uma versão livre (tags/branches) após 50 tentativas."
          exit 1

      - name: Create release branch from develop and push
        run: |
          RELEASE_BRANCH="${{ steps.semver.outputs.release_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$RELEASE_BRANCH"
          git push -u origin "$RELEASE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag and push
        run: |
          VERSION="${{ steps.semver.outputs.next_tag }}"

          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR release -> main (only if there are changes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.semver.outputs.next_tag }}"
          RELEASE_BRANCH="${{ steps.semver.outputs.release_branch }}"
          BASE="main"

          git fetch origin "$BASE" "$RELEASE_BRANCH" --quiet
          DIFF_COUNT=$(git rev-list --count "origin/$BASE..origin/$RELEASE_BRANCH")

          echo "Commits ahead of $BASE: $DIFF_COUNT"
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "Sem commits entre $BASE e $RELEASE_BRANCH. Não vou criar PR."
            exit 0
          fi

          EXISTING=$(gh pr list --head "$RELEASE_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$RELEASE_BRANCH" \
            --base "$BASE" \
            --title "Release ${VERSION}" \
            --body "Criada automaticamente após pipeline do develop passar. Versão: ${VERSION}"
