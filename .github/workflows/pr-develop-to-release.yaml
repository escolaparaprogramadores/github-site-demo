name: Create Release PR (release/* -> main)

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["develop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    # 1) só roda se CI do develop foi sucesso
    # 2) evita loop: não roda se quem disparou foi o bot
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop (full)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Stop if develop was updated from main (avoid infinite PR loop)
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $MSG"

          # Se o último commit no develop for um merge/sync vindo da main, não cria release
          if echo "$MSG" | grep -qiE "from main|Merge branch 'main'"; then
            echo "Develop updated from main. Skipping release creation to avoid loop."
            exit 0
          fi

      - name: Compute next SemVer tag (patch)
        id: semver
        run: |
          # pega a última tag no padrão vX.Y.Z; se não existir, começa em v1.0.0
          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            # remove o "v" e separa
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # incrementa PATCH
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "LAST_TAG=$LAST_TAG"
          echo "NEXT_TAG=$NEXT_TAG"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release branch from develop and push
        run: |
          VERSION="${{ steps.semver.outputs.next_tag }}"
          RELEASE_BRANCH="release/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Se a branch já existe, não tenta recriar
          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
            echo "Release branch already exists: $RELEASE_BRANCH"
          else
            git checkout -b "$RELEASE_BRANCH"
            git push -u origin "$RELEASE_BRANCH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR release -> main (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.semver.outputs.next_tag }}"
          RELEASE_BRANCH="release/${VERSION}"

          EXISTING=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$RELEASE_BRANCH" \
            --base main \
            --title "Release ${VERSION}" \
            --body "Criada automaticamente após CI do develop passar. Versão: ${VERSION}"
