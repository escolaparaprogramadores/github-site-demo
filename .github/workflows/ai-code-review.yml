name: AI Code Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  ai_review:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check AI_REVIEW_ENABLED
        run: |
          if [ "${{ secrets.AI_REVIEW_ENABLED }}" != "true" ]; then
            echo "AI_REVIEW_ENABLED != true. Encerrando."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          echo "PR_NUMBER(from payload)=$PR_NUMBER"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh api \
              repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].number // empty')
            echo "PR_NUMBER(from commit pulls)=$PR_NUMBER"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Nenhum PR associado a este workflow_run/SHA. Encerrando sem comentar."
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Get PR diff
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ steps.pr.outputs.pr_number }} > pr.diff

      - name: AI review and comment
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, urllib.request, time, random
          from urllib.error import HTTPError, URLError

          pr_number = os.environ["PR_NUMBER"]
          api_key = os.environ["OPENAI_API_KEY"]

          with open("pr.diff", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          MAX_CHARS = 15000
          if len(diff) > MAX_CHARS:
              diff = diff[:MAX_CHARS] + "\n\n[DIFF TRUNCADO POR LIMITE]"

          prompt = f"""
          Você é um revisor sênior. Faça code review do DIFF abaixo.
          Foco: Clean Code, SOLID, Clean Architecture, KISS, DRY, YAGNI.
          Seja direto em bullets. Aponte riscos e melhorias.

          DIFF:
          {diff}
          """

          payload = {
              "model": "gpt-4.1-mini",
              "messages": [
                  {"role": "system", "content": "Você é um revisor extremamente criterioso."},
                  {"role": "user", "content": prompt},
              ],
              "temperature": 0.2,
              "max_tokens": 800
          }

          def call_openai_with_retry(max_attempts=7):
              for attempt in range(1, max_attempts + 1):
                  try:
                      req = urllib.request.Request(
                          "https://api.openai.com/v1/chat/completions",
                          headers={
                              "Content-Type": "application/json",
                              "Authorization": f"Bearer {api_key}",
                          },
                          data=json.dumps(payload).encode("utf-8"),
                      )

                      with urllib.request.urlopen(req, timeout=90) as resp:
                          return json.loads(resp.read().decode("utf-8"))

                  except HTTPError as e:
                      if e.code == 429:
                          retry_after = e.headers.get("Retry-After")
                          if retry_after:
                              wait = int(retry_after)
                          else:
                              wait = min((2 ** attempt) + random.uniform(0, 2), 60)

                          print(f"429 Rate limit. Tentativa {attempt}/{max_attempts}. Esperando {wait}s...")
                          time.sleep(wait)
                          continue

                      if e.code in (500, 502, 503, 504):
                          wait = min((2 ** attempt) + random.uniform(0, 2), 60)
                          print(f"HTTP {e.code}. Tentativa {attempt}/{max_attempts}. Esperando {wait}s...")
                          time.sleep(wait)
                          continue

                      raise

                  except URLError as e:
                      wait = min((2 ** attempt) + random.uniform(0, 2), 60)
                      print(f"Erro de rede: {e}. Tentativa {attempt}/{max_attempts}. Esperando {wait}s...")
                      time.sleep(wait)
                      continue

              raise RuntimeError("Falhou após múltiplas tentativas.")

          data = call_openai_with_retry()
          review = data["choices"][0]["message"]["content"].strip()

          body = "## 🤖 AI Code Review\n\n" + review
          subprocess.run(["gh", "pr", "comment", pr_number, "--body", body], check=True)
          PY
