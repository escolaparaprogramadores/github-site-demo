      - name: AI review and comment
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, urllib.request

          pr_number = os.environ["PR_NUMBER"]
          api_key = os.environ["OPENAI_API_KEY"]

          # Pega só nomes dos arquivos alterados (bem mais leve)
          result = subprocess.run(
              ["gh", "pr", "diff", pr_number, "--name-only"],
              capture_output=True,
              text=True
          )

          files = result.stdout.strip().split("\n")[:5]  # só 5 arquivos
          content = "\n".join(files)

          # Limite agressivo
          content = content[:1000]

          payload = {
              "model": "gpt-4.1-mini",
              "messages": [
                  {
                      "role": "user",
                      "content": f"Revise brevemente estes arquivos alterados e aponte até 5 riscos técnicos:\n{content}"
                  }
              ],
              "temperature": 0,
              "max_tokens": 150
          }

          try:
              req = urllib.request.Request(
                  "https://api.openai.com/v1/chat/completions",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {api_key}",
                  },
                  data=json.dumps(payload).encode("utf-8"),
              )

              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              review = data["choices"][0]["message"]["content"].strip()

              body = "## 🤖 AI Code Review\n\n" + review
              subprocess.run(["gh", "pr", "comment", pr_number, "--body", body], check=True)

          except Exception:
              print("Falhou ou rate limit. Pulando review.")
          PY
