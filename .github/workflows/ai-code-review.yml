name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    # Flag liga/desliga
    if: ${{ vars.AI_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: AI review and comment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, urllib.request

          pr_number = os.environ["PR_NUMBER"]

          with open("pr.diff", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          # corta diff grande pra controlar custo e evitar timeout
          MAX_CHARS = 20000
          if len(diff) > MAX_CHARS:
              diff = diff[:MAX_CHARS] + "\n\n[DIFF TRUNCADO POR LIMITE]"

          prompt = f"""
          Você é um revisor sênior. Faça code review do DIFF abaixo.
          Foco: Clean Code, SOLID, Clean Architecture, KISS, DRY, YAGNI.
          Regras:
          - Seja direto (bullets).
          - Aponte riscos (bugs, edge cases, segurança), legibilidade, testes e design.
          - Sugira mudanças concretas quando possível.
          - Não invente contexto fora do diff.

          DIFF:
          {diff}
          """

          api_key = os.environ["OPENAI_API_KEY"]

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
              data=json.dumps({
                  "model": "gpt-4.1-mini",
                  "messages": [
                      {"role": "system", "content": "Você é um revisor de código extremamente criterioso e pragmático."},
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.2,
                  "max_tokens": 900
              }).encode("utf-8"),
          )

          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          review = data["choices"][0]["message"]["content"].strip()

          body = "## 🤖 AI Code Review (Clean Code / SOLID / Clean Architecture / KISS / DRY / YAGNI)\n\n" + review
          subprocess.run(["gh", "pr", "comment", pr_number, "--body", body], check=True)
          PY
