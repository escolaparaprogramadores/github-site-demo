name: AI Code Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  ai_review:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check AI_REVIEW_ENABLED
        run: |
          if [ "${{ secrets.AI_REVIEW_ENABLED }}" != "true" ]; then
            echo "AI_REVIEW_ENABLED != true. Encerrando."
            exit 0
          fi

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          echo "PR_NUMBER(from payload)=$PR_NUMBER"

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh api \
              repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].number // empty')
            echo "PR_NUMBER(from commit pulls)=$PR_NUMBER"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Nenhum PR associado a este run. Encerrando."
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.pr_number != '' }}
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: AI review (multi inline comments)
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - << 'PY'
          import os

          pr_number_raw = (os.environ.get("PR_NUMBER") or "").strip()
          if not pr_number_raw.isdigit():
            print(f"PR_NUMBER inválido/vazio: '{pr_number_raw}'. Encerrando sem review.")
            raise SystemExit(0)

          PR_NUMBER = int(pr_number_raw)
          print("OK PR_NUMBER =", PR_NUMBER)

          # ... (aqui entra seu script completo, sem mudar nada)
          PY
