name: AI Code Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

# Evita vários runs simultâneos (reduz 429) e mantém só o mais recente por PR
concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  ai_review:
    # Só roda se o CI terminou com sucesso (o toggle fica num step, pq secrets não funciona no if do job com workflow_run)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check AI_REVIEW_ENABLED
        run: |
          if [ "${{ secrets.AI_REVIEW_ENABLED }}" != "true" ]; then
            echo "AI_REVIEW_ENABLED != true. Encerrando."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Melhor fonte: payload do workflow_run (quando veio de PR)
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          echo "PR_NUMBER(from payload)=$PR_NUMBER"

          # Fallback: tenta mapear PR pelo SHA
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh api \
              repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].number // empty')
            echo "PR_NUMBER(from commit pulls)=$PR_NUMBER"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Nenhum PR associado a este workflow_run/SHA. Encerrando sem comentar."
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Get PR diff
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ steps.pr.outputs.pr_number }} > pr.diff

      - name: AI review and comment
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, urllib.request, time
          from urllib.error import HTTPError, URLError

          pr_number = os.environ["PR_NUMBER"]

          with open("pr.diff", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          MAX_CHARS = 20000
          if len(diff) > MAX_CHARS:
              diff = diff[:MAX_CHARS] + "\n\n[DIFF TRUNCADO POR LIMITE]"

          prompt = f"""
          Você é um revisor sênior. Faça code review do DIFF abaixo.
          Foco: Clean Code, SOLID, Clean Architecture, KISS, DRY, YAGNI.
          Regras:
          - Seja direto (bullets).
          - Aponte riscos (bugs, edge cases, segurança), legibilidade, testes e design.
          - Sugira mudanças concretas quando possível.
          - Não invente contexto fora do diff.

          DIFF:
          {diff}
          """

          api_key = os.environ["OPENAI_API_KEY"]

          payload = {
              "model": "gpt-4.1-mini",
              "messages": [
                  {"role": "system", "content": "Você é um revisor de código extremamente criterioso e pragmático."},
                  {"role": "user", "content": prompt},
              ],
              "temperature": 0.2,
              "max_tokens": 900
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
              data=json.dumps(payload).encode("utf-8"),
          )

          def call_with_retry(request, max_attempts=6):
              for attempt in range(1, max_attempts + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504):
                          wait = min(2 ** attempt, 60)
                          print(f"HTTP {e.code}. Retry {attempt}/{max_attempts} in {wait}s...")
                          time.sleep(wait)
                          continue
                      raise
                  except URLError as e:
                      wait = min(2 ** attempt, 60)
                      print(f"Network error: {e}. Retry {attempt}/{max_attempts} in {wait}s...")
                      time.sleep(wait)
                      continue
              raise RuntimeError("OpenAI request failed after retries.")

          data = call_with_retry(req)
          review = data["choices"][0]["message"]["content"].strip()

          body = "## 🤖 AI Code Review (Clean Code / SOLID / Clean Architecture / KISS / DRY / YAGNI)\n\n" + review
          subprocess.run(["gh", "pr", "comment", pr_number, "--body", body], check=True)
          PY
