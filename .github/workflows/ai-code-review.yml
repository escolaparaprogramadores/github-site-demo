name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Check AI_REVIEW_ENABLED
        run: |
          if [ "${{ secrets.AI_REVIEW_ENABLED }}" != "true" ]; then
            echo "AI_REVIEW_ENABLED != true. Encerrando."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: AI review and comment
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, urllib.request, time
          from urllib.error import HTTPError

          pr_number = os.environ["PR_NUMBER"]
          api_key = os.environ["OPENAI_API_KEY"]

          time.sleep(2)

          with open("pr.diff", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          MAX_CHARS = 3000
          diff = diff[:MAX_CHARS]

          payload = {
              "model": "gpt-4.1-mini",
              "messages": [
                  {"role": "system", "content": "Revisor técnico direto e pragmático."},
                  {"role": "user", "content": f"Faça um code review objetivo:\n\n{diff}"}
              ],
              "temperature": 0.1,
              "max_tokens": 300
          }

          try:
              req = urllib.request.Request(
                  "https://api.openai.com/v1/chat/completions",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {api_key}",
                  },
                  data=json.dumps(payload).encode("utf-8"),
              )

              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              review = data["choices"][0]["message"]["content"].strip()

              body = "## 🤖 AI Code Review\n\n" + review
              subprocess.run(["gh", "pr", "comment", pr_number, "--body", body], check=True)

          except HTTPError as e:
              if e.code == 429:
                  print("Rate limit atingido. Pulando comentário.")
              else:
                  raise
          PY
