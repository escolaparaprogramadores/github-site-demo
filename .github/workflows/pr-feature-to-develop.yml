name: PR feature -> develop

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          # Se já existe PR aberta dessa branch para develop, não cria outra
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$BRANCH" \
            --base develop \
            --title "Merge $BRANCH -> develop" \
            --body "PR automática criada a partir de push em $BRANCH."
