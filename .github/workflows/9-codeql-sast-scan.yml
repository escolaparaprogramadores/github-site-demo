name: Security - CodeQL SAST Scan

on:
  pull_request:
    branches: ["develop", "main", "release/**"]
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Para JS/TS geralmente não precisa build, mas é comum instalar deps
      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Block PR on HIGH or CRITICAL CodeQL alerts
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER_REPO="${{ github.repository }}"
          SHA="${{ github.event.pull_request.head.sha }}"

          echo "Checking CodeQL alerts for ref ${SHA}..."

          ALERT_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER_REPO}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=${SHA}" \
            --paginate \
            --jq '[.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high" or .severity == "critical" or .severity == "high")] | length')

          echo "HIGH + CRITICAL alerts found: ${ALERT_COUNT}"

          if [ "${ALERT_COUNT}" -gt 0 ]; then
            echo "::error::Bloqueando PR: existem ${ALERT_COUNT} alertas HIGH ou CRITICAL do CodeQL abertos."
            exit 1
          fi
          echo "Nenhum alerta HIGH ou CRITICAL encontrado. PR pode ser mergeada." 