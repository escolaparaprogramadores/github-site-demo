name: PR main -> develop (back-merge)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD="main"
          BASE="develop"

          EXISTING=$(gh pr list --head "$HEAD" --base "$BASE" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$HEAD" \
            --base "$BASE" \
            --title "Back-merge main -> develop" \
            --body "PR automática criada após merge/push em main para sincronizar develop."
