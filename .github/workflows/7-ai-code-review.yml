name: 7 - AI Code Review

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai_review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # garante que o checkout é do HEAD do PR (não da base)
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check AI_REVIEW_ENABLED
        run: |
          if [ "${{ secrets.AI_REVIEW_ENABLED }}" != "true" ]; then
            echo "AI_REVIEW_ENABLED != true. Encerrando."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AI review
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/ai_review.py
