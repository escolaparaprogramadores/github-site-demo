name: PR hotfix -> main

on:
  push:
    branches:
      - "hotfix/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Hotfix $BRANCH -> main" \
            --body "PR automática criada a partir de push em $BRANCH."
