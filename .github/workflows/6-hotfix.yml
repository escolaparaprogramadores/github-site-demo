name: 6 - Hotfix

on:
  push:
    branches:
      - "hotfix/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if not exists (hotfix -> main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BASE="main"

          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi

          gh pr create \
            --head "$BRANCH" \
            --base "$BASE" \
            --title "Hotfix $BRANCH -> $BASE" \
            --body "PR automática criada a partir de push em $BRANCH."
