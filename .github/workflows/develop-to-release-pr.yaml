name: Create Release PR (release/* -> main)

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["develop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create release branch and PR to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: create release ${{ github.run_number }}"
          branch: release/${{ github.run_number }}
          base: main
          title: "Release ${{ github.run_number }}"
          body: |
            PR automática gerada quando o CI do develop passou.
            Release branch: release/${{ github.run_number }}
            Base: main

