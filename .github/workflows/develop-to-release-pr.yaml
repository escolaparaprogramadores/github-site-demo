name: Create Release PR (develop -> release/*)

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["develop"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create PR develop -> release/<run_number>
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: release/${{ github.run_number }}
          title: "Release ${{ github.run_number }}"
          body: |
            PR automática para criar a branch de release.
            Origem: develop
            Destino: release/${{ github.run_number }}
