name: CI

on:
  push:
    branches:
      - "feature/**"
      - "hotfix/**"
      - "develop"
      - "release/**"
  pull_request:
    branches:
      - "develop"
      - "main"
      - "release/**"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
