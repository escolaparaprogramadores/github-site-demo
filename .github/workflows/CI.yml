name: CI

on:
  push:
    workflow_dispatch:
    branches:
      - "feature/**"
      - "hotfix/**"
      - "develop"
      - "release/**"
  pull_request:
    branches:
      - "develop"
      - "main"
      - "release/**"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

