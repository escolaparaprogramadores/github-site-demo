name: CD - deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'   # exemplo: v1.0.0

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    needs: [run-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: echo "Building app..."

      - name: Deploy
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "Publicando em develop"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Publicando em main"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Publicando em PRODUCAO (tag)"
          else
            echo "Ambiente não mapeado: ${GITHUB_REF}"
            exit 1
          fi
